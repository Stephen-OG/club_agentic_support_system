<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Madupe sign-in link</title>
  </head>
  <body style="margin:0;background:#f4f7f6;color:#17211f;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7f6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dce5e1;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="padding:28px;">
                <div style="font-size:20px;font-weight:700;color:#0b332d;">Madupe</div>
                <h1 style="margin:24px 0 12px;font-size:24px;line-height:1.25;color:#102420;">Sign in to Madupe</h1>
                <p style="margin:0 0 18px;font-size:16px;line-height:1.55;color:#42514d;">Use this secure link to sign in to your Madupe command center.</p>
                <p style="margin:0 0 22px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0b332d;color:#ffffff;text-decoration:none;font-weight:700;border-radius:6px;padding:13px 18px;">Sign in to Madupe</a>
                </p>
                <p style="margin:0 0 8px;font-size:14px;line-height:1.5;color:#61706c;">Your one-time code is:</p>
                <p style="margin:0 0 20px;font-size:24px;font-weight:700;letter-spacing:3px;color:#102420;">{{ .Token }}</p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#61706c;word-break:break-all;">Link: {{ .ConfirmationURL }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 28px 28px;border-top:1px solid #e8eeeb;font-size:13px;line-height:1.5;color:#6b7774;">If you did not request this sign-in link, you can ignore this email.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
